<!DOCTYPE html>
<html>
<head>
    <title>Register Dog - StreetSafe AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-container">

    <h2 class="page-title">Register a Street Dog</h2>

    <form method="POST" class="form-card">

        <label>QR Code</label>
        <input type="text" name="qr_code" required>

        <label>Latitude</label>
        <input type="text" name="latitude" required>

        <label>Longitude</label>
        <input type="text" name="longitude" required>

        <label>Gender</label>
        <select name="gender">
            <option>Male</option>
            <option>Female</option>
        </select>

        <label>Estimated Age</label>
        <input type="number" name="estimated_age">

        <label>Color</label>
        <input type="text" name="color">

        <label>Health Status</label>
        <input type="text" name="health_status">

        <label>Sterilized</label>
        <select name="sterilized">
            <option>Yes</option>
            <option>No</option>
        </select>

        <label>Last Seen Date</label>
        <input type="date" name="last_seen_date">

        <button type="submit" class="btn-primary">Register Dog</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>

</div>

</body>
</html>
